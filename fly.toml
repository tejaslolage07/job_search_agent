app = "job-search-agent-CHANGE-ME"   # must be globally unique; `fly launch --no-deploy` can rename it
primary_region = "bom"               # Mumbai; use "iad" for the cheapest rates

[build]
  dockerfile = "Dockerfile"

[env]
  JOB_SEARCH_AGENT_HOME = "/vol"

[mounts]
  source = "vol"
  destination = "/vol"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler and a running crawl live inside this process: never stop or scale it to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
