[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job_search_agent"
version = "0.1.0"
description = "Monitor company career pages, detect new jobs, rank them against a personal profile."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pypdf>=4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
job_search_agent = "job_search_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_search_agent = ["py.typed", "web/static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
