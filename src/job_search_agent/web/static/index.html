<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Agent</title>
<style>
  :root{--bg:#f6f7fa;--card:#fff;--fg:#1c2230;--muted:#667085;--line:#e3e6ee;--accent:#2457d6;--accent-fg:#fff;--ok:#127a4b;--warn:#a65b00;--bad:#b3261e;--chip:#eef1f7}
  @media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c26;--fg:#e8ebf2;--muted:#9aa3b5;--line:#2a3142;--accent:#7aa2ff;--accent-fg:#0b1020;--ok:#4cc38a;--warn:#e0a24a;--bad:#ff8a80;--chip:#222839}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .brand{font-weight:700} nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit}
  nav button.on{background:var(--chip);color:var(--fg);font-weight:600}
  .spacer{flex:1} .pill{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--muted)}
  .pill.run{background:var(--accent);color:var(--accent-fg)}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  h2{margin:.1em 0 .6em;font-size:1.15rem} h3{margin:1em 0 .4em;font-size:1rem}
  .muted{color:var(--muted)} .small{font-size:.85rem}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
  input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  input[type=checkbox]{width:auto} .chk{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--fg);margin:4px 0}
  .chk label{margin:0;color:var(--fg);font-size:.95rem}
  button.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
  button.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)} button.btn:disabled{opacity:.5;cursor:not-allowed}
  button.btn.danger{color:var(--bad)} button.btn.sm{padding:3px 9px;font-size:.85rem}
  .err{color:var(--bad);font-size:.82rem;min-height:1em} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:.9rem} th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .tablewrap{overflow-x:auto}
  .badge{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
  .badge.accept{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .badge.reject{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  .badge.review{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .bar-outer{height:8px;border-radius:99px;background:var(--chip);overflow:hidden} .bar-inner{height:100%;background:var(--accent);transition:width .4s}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
  .tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end} .row>*{flex:0 1 auto}
  .banner{padding:10px 14px;border-radius:10px;margin-bottom:12px;background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
  .log{background:var(--bg);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;padding:8px;font:12px/1.5 ui-monospace,Menlo,monospace}
  .log .error{color:var(--bad)} .log .warning{color:var(--warn)}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--card);border-left:1px solid var(--line);padding:18px;overflow:auto;z-index:20;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;font-size:.8rem}
  a{color:var(--accent)} .hidden{display:none !important}
  .reasons li{margin:2px 0} .reasons .reject{color:var(--bad)} .reasons .accept,.reasons .plus{color:var(--ok)} .reasons .minus{color:var(--warn)}
  @media (max-width:640px){.bar{gap:8px}}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">Job Search Agent</span>
  <nav id="nav"></nav><span class="spacer"></span>
  <span id="chip" class="pill">idle</span>
</div></header>
<main id="main"></main>
<footer id="foot" class="small muted" style="max-width:1200px;margin:0 auto;padding:0 16px 24px"></footer>
<div id="drawer" class="drawer hidden"></div>

<script>
"use strict";
// ---------- tiny helpers (everything is built with textContent: job text can never inject HTML) ----------
// Element.replaceChildren would render null/false children as the text "null"/"false": skip them.
const _replaceChildren = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { return _replaceChildren.apply(this, kids.flat().filter((k) => k !== null && k !== undefined && k !== false)); };
const $ = (s, r = document) => r.querySelector(s);
// Every time shown on this page is Indian Standard Time (IST, UTC+05:30), whatever time zone the browser is set to.
const IST_PARTS = { date: new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric" }),
  time: new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) };
function ist(iso, what = "datetime") {
  const d = new Date(iso); if (!iso || isNaN(d)) return iso || "—";
  return what === "time" ? IST_PARTS.time.format(d) : `${IST_PARTS.date.format(d)}, ${IST_PARTS.time.format(d)} IST`;
}
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const safeUrl = (u) => { try { const p = new URL(u); return p.protocol === "http:" || p.protocol === "https:" ? p.href : null; } catch { return null; } };
function extLink(url, text, cls) { const u = safeUrl(url); return u ? h("a", { href: u, target: "_blank", rel: "noopener noreferrer", class: cls }, text) : h("span", { class: "muted" }, "no link"); }
async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.json !== undefined) { init.body = JSON.stringify(opts.json); init.headers["Content-Type"] = "application/json"; }
  if (opts.form) init.body = opts.form;
  const r = await fetch(path, init);
  let data = null; try { data = await r.json(); } catch { /* empty */ }
  if (!r.ok) { const e = new Error((data && (data.detail && (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)))) || `HTTP ${r.status}`); e.status = r.status; e.data = data; throw e; }
  return data;
}
const csv = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
const num = (s) => (s === "" || s === null ? null : Number(s));
function toast(msg, bad) { const t = h("div", { class: "banner", style: "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;max-width:90%" + (bad ? ";border-color:var(--bad)" : "") }, msg); document.body.append(t); setTimeout(() => t.remove(), bad ? 6000 : 2500); }
function field(label, input, name) { return h("div", {}, h("label", {}, label), input, h("div", { class: "err", "data-err": name || "" })); }
function setErrors(root, errors) {
  root.querySelectorAll("[data-err]").forEach((e) => (e.textContent = ""));
  const friendly = (m) => (/valid number|should be a valid/i.test(m) ? "Enter a number" : /field required/i.test(m) ? "This field is required" : m);
  for (const err of errors || []) { const e = { ...err, message: friendly(err.message) }; const slot = root.querySelector(`[data-err="${e.field}"]`) || root.querySelector(`[data-err="${e.field.split(".")[0]}"]`); if (slot) slot.textContent = e.message; }
}
function bar(done, total) { const pct = total ? Math.min(100, Math.round((100 * done) / total)) : 0; return h("div", { class: "bar-outer" }, h("div", { class: "bar-inner", style: `width:${pct}%` })); }

// ---------- app shell ----------
const TABS = ["Jobs", "Discover", "Runs", "Companies", "Profile"];
let tab = localStorage.getItem("tab") || "Jobs", appState = null, stream = null;
function showTab(t) { tab = t; localStorage.setItem("tab", t); closeStream(); renderNav(); ({ Jobs: viewJobs, Discover: viewDiscover, Runs: viewRuns, Companies: viewCompanies, Profile: viewProfile })[t](); }
function renderNav() { const n = $("#nav"); n.replaceChildren(...TABS.map((t) => h("button", { class: t === tab ? "on" : "", onclick: () => showTab(t) }, t))); }
async function refreshState() {
  try { appState = await api("/api/state"); } catch { return; }
  $("#foot").textContent = "Data folder: " + appState.home;
  const c = $("#chip"); c.textContent = appState.busy ? `running #${appState.current_run_id}` : "idle"; c.className = "pill" + (appState.busy ? " run" : "");
}
function closeStream() { if (stream) { stream.close(); stream = null; } }
function closeDrawer() { $("#drawer").classList.add("hidden"); }

// ---------- PROFILE ----------
async function viewProfile() {
  const main = $("#main"); main.replaceChildren(h("div", { class: "muted" }, "Loading…"));
  const data = await api("/api/profile"); const p = data.profile || {
    current_ctc_lpa: "", expected_ctc_lpa: { min: "", target: "" }, usd_to_inr: 88, years_experience: "", locations: { preferred: ["Bengaluru", "Remote-India"], accept_hybrid: true, accept_onsite_outside_preferred: false },
    target_titles: ["Software Engineer", "Backend Engineer"], seniority: { min_level: "junior", max_level: "mid", reject_titles: ["intern", "principal", "staff", "director", "vp", "head", "manager"] },
    max_required_years: null, must_have_keywords: ["Python"], nice_to_have_keywords: [], exclude_keywords: [], exclude_companies: [], notice_period_days: null, work_authorization: "" };
  const levels = ["intern", "junior", "mid", "senior", "staff", "principal", "director"];
  const I = (name, v, type = "text", extra = {}) => h("input", { type, "data-f": name, value: v ?? "", step: type === "number" ? "any" : null, ...extra });
  const T = (name, arr) => h("input", { type: "text", "data-f": name, value: (arr || []).join(", "), placeholder: "comma, separated" });
  const sel = (name, opts, v) => h("select", { "data-f": name }, opts.map((o) => h("option", { value: o, selected: o === v }, o)));
  const chk = (name, v, label) => h("div", { class: "chk" }, h("input", { type: "checkbox", "data-f": name, checked: v, id: "c_" + name }), h("label", { for: "c_" + name }, label));
  const form = h("div", {},
    data.invalid ? h("div", { class: "banner" }, "Your saved profile.yaml has problems: " + data.invalid) : null,
    h("div", { class: "card" }, h("h2", {}, "Compensation & experience"), h("div", { class: "grid" },
      field("Current CTC (LPA)", I("current_ctc_lpa", p.current_ctc_lpa, "number"), "current_ctc_lpa"),
      field("Expected CTC – minimum (LPA)", I("expected_ctc_lpa.min", p.expected_ctc_lpa.min, "number"), "expected_ctc_lpa.min"),
      field("Expected CTC – target (LPA)", I("expected_ctc_lpa.target", p.expected_ctc_lpa.target, "number"), "expected_ctc_lpa.target"),
      field("USD → INR rate (only for USD postings)", I("usd_to_inr", p.usd_to_inr, "number"), "usd_to_inr"),
      field("Years of experience", I("years_experience", p.years_experience, "number"), "years_experience"),
      field("Max years a posting may require (blank = experience + 2)", I("max_required_years", p.max_required_years, "number"), "max_required_years"),
      field("Notice period (days)", I("notice_period_days", p.notice_period_days, "number"), "notice_period_days"),
      field("Work authorization", I("work_authorization", p.work_authorization), "work_authorization")),
      h("div", { class: "small muted" }, "Your current and expected pay are sent to the AI together with the rest of the profile, so it can judge a job's posted pay. Notice period and work authorization are stored only and never sent.")),
    h("div", { class: "card" }, h("h2", {}, "Where & what"),
      h("div", { class: "grid" },
        field("Preferred locations (optional: cities, countries or Remote-<Country>; blank = anywhere)", T("locations.preferred", p.locations.preferred), "locations.preferred"),
        field("Target job titles", T("target_titles", p.target_titles), "target_titles"),
        field("Seniority – lowest", sel("seniority.min_level", levels, p.seniority.min_level), "seniority.min_level"),
        field("Seniority – highest", sel("seniority.max_level", levels, p.seniority.max_level), "seniority.max_level"),
        field("Reject titles containing", T("seniority.reject_titles", p.seniority.reject_titles), "seniority.reject_titles")),
      chk("locations.accept_hybrid", p.locations.accept_hybrid, "Hybrid roles are acceptable"),
      chk("locations.accept_onsite_outside_preferred", p.locations.accept_onsite_outside_preferred, "Roles outside my preferred locations are acceptable")),
    h("div", { class: "card" }, h("h2", {}, "Keywords"), h("div", { class: "grid" },
      field("Must-have keywords (optional)", T("must_have_keywords", p.must_have_keywords), "must_have_keywords"),
      field("Nice-to-have keywords", T("nice_to_have_keywords", p.nice_to_have_keywords), "nice_to_have_keywords"),
      field("Exclude keywords (reject if present)", T("exclude_keywords", p.exclude_keywords), "exclude_keywords"),
      field("Exclude companies", T("exclude_companies", p.exclude_companies), "exclude_companies"))),
    h("div", { class: "row" }, h("button", { class: "btn primary", id: "saveProfile" }, "Save profile"), h("span", { id: "saveMsg", class: "small" })));
  const resumes = h("div", { class: "card" }, h("h2", {}, "Resumes"),
    h("div", { class: "small muted" }, "Only read for jobs the rules can't decide on their own, and only on this computer (unless you turn on LLM scoring)."), h("div", { id: "resumeList" }),
    h("div", { class: "row", style: "margin-top:10px" }, field("Variant name", h("input", { id: "rName", placeholder: "e.g. backend", maxlength: 40 })),
      field("PDF file", h("input", { id: "rFile", type: "file", accept: "application/pdf" })), h("button", { class: "btn", id: "rUp" }, "Upload"), h("span", { id: "rMsg", class: "small err" })));
  const secrets = h("div", { class: "card" }, h("h2", {}, "AI matching (OpenAI)"),
    h("div", { class: "small muted" }, "An OpenAI model matches every job: first against your profile details (including your pay), then, if that is unclear, against your resume. Notice period and work authorization are never sent. The key is read from the .env file on this computer and is never shown or stored in the browser."),
    h("div", { id: "llmStatus", style: "margin-top:8px" }, "Checking…"));
  main.replaceChildren(form, resumes, secrets);

  const collect = () => {
    const g = (n) => $(`[data-f="${n}"]`, form), val = (n) => g(n).value, c = (n) => g(n).checked;

      usd_to_inr: num(val("usd_to_inr")), years_experience: num(val("years_experience")), max_required_years: num(val("max_required_years")),
      notice_period_days: num(val("notice_period_days")), work_authorization: val("work_authorization") || null,
      locations: { preferred: csv(val("locations.preferred")), accept_hybrid: c("locations.accept_hybrid"), accept_onsite_outside_preferred: c("locations.accept_onsite_outside_preferred") },
      target_titles: csv(val("target_titles")), seniority: { min_level: val("seniority.min_level"), max_level: val("seniority.max_level"), reject_titles: csv(val("seniority.reject_titles")) },
      must_have_keywords: csv(val("must_have_keywords")), nice_to_have_keywords: csv(val("nice_to_have_keywords")), exclude_keywords: csv(val("exclude_keywords")), exclude_companies: csv(val("exclude_companies")),

  };

    $("#resumeList").replaceChildren(list.length ? h("table", {}, h("tbody", {}, list.map((r) => h("tr", {}, h("td", {}, h("b", {}, r.name)), h("td", { class: "muted" }, `${Math.round(r.bytes / 1024)} KB`),
      h("td", {}, h("button", { class: "btn sm danger", onclick: async () => { try { drawResumes((await api(`/api/resumes/${encodeURIComponent(r.name)}`, { method: "DELETE" })).resumes); refreshState(); } catch (e) { toast(e.message, true); } } }, "Remove")))))) : h("div", { class: "muted" }, "No resumes uploaded yet."));
  };
  drawResumes(data.resumes);

  };

      x.openai_key_set ? h("div", { class: "ok" }, `OpenAI API key found (${x.key_hint || "short key"}). Model: ${x.model}. ${x.concurrency} calls at a time.`)
        : h("div", {}, h("div", { class: "warn" }, "No OpenAI API key found."), h("div", { class: "small" }, `Add this line to ${x.env_file} and restart the dashboard:`), h("pre", {}, "OPENAI_API_KEY=sk-...")),
      x.prompt_problem ? h("div", { class: "bad small" }, "Prompt problem: " + x.prompt_problem) : h("div", { class: "small muted" }, `Prompts (edit to change what the AI is asked): ${x.prompt_file} (profile check) and ${x.resume_prompt_file} (resume check for unclear jobs)`));
  };
  llmStatus();
}

// ---------- COMPANIES ----------
let catOffset = 0;
async function viewCompanies() {
  const main = $("#main");
  const q = h("input", { placeholder: "Search company or sector", id: "cq" }), band = h("select", { id: "cb" }, ["", "large", "medium", "small", "micro"].map((o) => h("option", { value: o }, o || "any size"))),
    ver = h("select", { id: "cv" }, [["", "any feed status"], ["yes", "live job feed verified"], ["no", "no feed found"]].map(([v, t]) => h("option", { value: v }, t))),
    cr = h("select", { id: "cc" }, [["", "any"], ["yes", "in my crawler"], ["no", "not in my crawler"]].map(([v, t]) => h("option", { value: v }, t)));
  const list = h("div"), info = h("div", { class: "small muted" });
  const custom = h("div", { class: "card" }, h("h2", {}, "Add a company by hand"), h("div", { class: "row" },
    field("Company", h("input", { id: "nName" })), field("Careers page or job-board URL", h("input", { id: "nUrl", placeholder: "https://…", style: "min-width:280px" })),
    field("Type", h("select", { id: "nAts" }, ["auto", "greenhouse", "lever", "ashby", "workday", "custom"].map((o) => h("option", {}, o)))),
    h("button", { class: "btn", id: "nAdd" }, "Add & enable"), h("span", { id: "nMsg", class: "small err" })));
  main.replaceChildren(h("div", { class: "card" }, h("h2", {}, "Companies"), h("div", { class: "small muted" }, "Pick which company career pages to monitor. Companies with a verified feed can be crawled right away; others need a working careers URL."),
    h("div", { class: "row", style: "margin:10px 0" }, field("Search", q), field("Size", band), field("Job feed", ver), field("Crawler", cr),
      h("button", { class: "btn primary", id: "cAdd" }, "Add selected to crawler"), h("button", { class: "btn", id: "cOff" }, "Disable selected")), info, list), custom);
  const load = async () => {
    const p = new URLSearchParams({ q: q.value, band: band.value, verified: ver.value, crawler: cr.value, limit: 100, offset: catOffset });
    const d = await api("/api/catalog?" + p);
    info.textContent = `${d.total} companies` + (d.total > 100 ? ` — showing ${catOffset + 1}–${Math.min(catOffset + 100, d.total)}` : "");
    list.replaceChildren(h("div", { class: "tablewrap" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, ""), h("th", {}, "Company"), h("th", {}, "Size"), h("th", {}, "Feed"), h("th", {}, "Crawler"), h("th", {}, "HQ / sector"), h("th", {}, "Careers"))),
      h("tbody", {}, d.rows.map((r) => h("tr", {}, h("td", {}, h("input", { type: "checkbox", "data-name": r.company })), h("td", {}, h("b", {}, r.company)), h("td", {}, h("span", { class: "badge" }, r.size_band)),
        h("td", {}, r.verified === "yes" ? h("span", { class: "badge accept" }, r.ats_type) : h("span", { class: "badge" }, r.portal_status || "none")),
