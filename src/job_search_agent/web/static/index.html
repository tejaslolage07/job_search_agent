<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Agent</title>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  :root{--bg:#0d0d10;--side:#121216;--card:#16161b;--card2:#1b1b22;--fg:#f3f3f6;--muted:#9a9aa8;--line:#25252d;--accent:#8b5cf6;--accent2:#a78bfa;--accent-fg:#fff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#1f1f27;--glow:rgba(139,92,246,.35);--shadow:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
  :root[data-theme=light]{--bg:#f4f4f8;--side:#fff;--card:#fff;--card2:#f6f5fb;--fg:#17171c;--muted:#6b6b7b;--line:#e6e6ee;--accent:#7c3aed;--accent2:#6d28d9;--ok:#16a34a;--warn:#b45309;--bad:#dc2626;--chip:#efeef7;--glow:rgba(124,58,237,.25);--shadow:0 8px 24px rgba(30,20,60,.08);color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  aside{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;padding:4px 8px 16px}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;box-shadow:0 4px 14px var(--glow)}
  .logo svg{width:18px;height:18px;stroke:#fff}
  .navlabel{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
  nav{display:flex;flex-direction:column;gap:4px}
  nav button{display:flex;align-items:center;gap:11px;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font:inherit;font-weight:500;text-align:left;transition:.15s}
  nav button svg{width:18px;height:18px;flex:none}
  nav button:hover{background:var(--chip);color:var(--fg)}
  nav button.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 6px 18px var(--glow)}
  .spacer{flex:1}
  .side-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.82rem}
  .side-card .row{align-items:center;gap:8px}
  .themebtn{display:flex;align-items:center;justify-content:space-between;background:none;border:0;color:var(--muted);padding:8px 10px;cursor:pointer;font:inherit;border-radius:10px}
  .themebtn:hover{background:var(--chip)}
  .switch{width:34px;height:20px;border-radius:99px;background:var(--chip);border:1px solid var(--line);position:relative}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.2s}
  :root:not([data-theme=light]) .switch{background:var(--accent)} :root:not([data-theme=light]) .switch::after{left:16px;background:#fff}
  .content{padding:26px 32px 20px;max-width:1320px;width:100%}
  .pagehead .spacer{flex:1} .pagehead{align-items:center}
  .iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:.15s;padding:0;margin-right:-4px}
  .iconbtn:hover{border-color:var(--accent2);transform:translateY(-1px)} .iconbtn svg{width:20px;height:20px}
  .avatar{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:700;font-size:.95rem;font-family:inherit;letter-spacing:.02em;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px var(--glow);transition:.15s;padding:0}
  .avatar:hover{transform:translateY(-1px)} .avatar.on{border-color:var(--fg)} .avatar svg{width:20px;height:20px}
  .pagehead{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .pagehead h1{margin:0;font-size:1.75rem;letter-spacing:-.02em;line-height:1.15}
  .pagehead .sub{color:var(--muted);margin-top:2px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;padding:5px 12px;border-radius:99px;background:var(--chip);color:var(--muted);border:1px solid var(--line)}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .pill.run{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .pill.run::before{background:var(--accent2);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.25}}
  main{min-height:60vh}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
  h2{margin:.1em 0 .7em;font-size:1.08rem;font-weight:650;letter-spacing:-.01em} h3{margin:1.1em 0 .45em;font-size:.95rem}
  .muted{color:var(--muted)} .small{font-size:.84rem}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .grid{align-items:stretch} .grid>div{display:flex;flex-direction:column;min-width:0} .grid>div>label{flex:1 1 auto}
  input:not([type=checkbox]):not([type=file]),select{height:42px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:500;line-height:1.35}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--fg);font:inherit;outline:none;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  input[type=checkbox]{width:auto;accent-color:var(--accent)} .chk{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--fg);margin:5px 0}
  .chk label{margin:0;color:var(--fg);font-size:.92rem}
  button.btn{padding:8px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;font:inherit;font-weight:500;transition:.15s;text-decoration:none;display:inline-block}
  button.btn:hover:not(:disabled),a.btn:hover{border-color:var(--accent2);transform:translateY(-1px)}
  button.btn.primary,a.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--glow)}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  button.btn.danger{color:var(--bad)} button.btn.sm,a.btn.sm{padding:4px 11px;font-size:.82rem;border-radius:8px}
  a.btn{padding:8px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);text-decoration:none;display:inline-block;font-weight:500}
  .err{color:var(--bad);font-size:.8rem;min-height:1em} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:.88rem}
  th,td{padding:11px 12px;text-align:left;vertical-align:middle}
  th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--card2);white-space:nowrap}
  th:first-child{border-radius:10px 0 0 10px} th:last-child{border-radius:0 10px 10px 0}
  tbody td{border-bottom:1px solid var(--line)} tbody tr:hover td{background:var(--card2)}
  .tablewrap{overflow-x:auto}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap;font-weight:500}
  .badge.accept,.badge.reject,.badge.review{padding-left:8px} .badge.accept::before,.badge.reject::before,.badge.review::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.accept{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .badge.reject{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  .badge.review{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .bar-outer{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:6px 0} .bar-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:18px}
  .stat{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;color:var(--fg);font:inherit;transition:.2s;overflow:hidden}
  .stat:hover{transform:translateY(-2px);border-color:var(--accent2)}
  .stat .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);margin-bottom:18px}
  .stat .ico svg{width:18px;height:18px;stroke:var(--accent2)}
  .stat .lbl{font-size:.82rem;color:var(--muted)} .stat .val{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
  .stat .delta{font-size:.76rem;color:var(--muted)}
  .stat.on{background:linear-gradient(160deg,#9b6bff 0%,#6d3fd8 55%,#2a1a55 100%);border-color:var(--accent2);box-shadow:0 12px 34px var(--glow)}
  .stat.on .lbl,.stat.on .delta{color:rgba(255,255,255,.8)} .stat.on .val{color:#fff} .stat.on .ico{background:rgba(255,255,255,.18)} .stat.on .ico svg{stroke:#fff}
  .cuts{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-bottom:18px} .cuts .card{margin:0}
  .cut{display:grid;grid-template-columns:150px 1fr 36px;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--fg);font:inherit;padding:6px 8px;border-radius:10px;cursor:pointer;text-align:left}
  .cut:hover{background:var(--card2)} .cut.on{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .cut .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cut .n{text-align:right;font-weight:650} .cut .bar-outer{margin:0}
  .cutmore{margin-top:6px}
  .daychart{display:flex;gap:6px;align-items:stretch;height:190px} .daycol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .daytrack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center} .daybar{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
  .daynum{font-size:.74rem;font-weight:600;height:1em} .daylbl{font-size:.68rem;color:var(--muted);white-space:nowrap}
  .cuthead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px} .cuthead h2{margin:0} .cuthead input{width:210px;height:36px;padding:6px 12px;border-radius:99px}
  @media (max-width:1000px){.cuts{grid-template-columns:1fr}}
  .split{display:grid;grid-template-columns:1fr;gap:12px}
  .split .item .top{display:flex;justify-content:space-between;font-size:.84rem}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end} .row>*{flex:0 1 auto}
  #cq{min-width:230px} td.nw{white-space:nowrap} #saveProfile{margin-bottom:18px} .row:has(#saveProfile){margin-bottom:18px;align-items:center}
  .row .err:empty{display:none} .row>div:has(>input,>select){min-width:150px} .row button.btn:not(.sm){height:42px} .row>div>label{white-space:nowrap}
  .row>.small,.row>span.small{align-self:center}
  .banner{padding:11px 15px;border-radius:12px;margin-bottom:14px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
  .log{background:var(--bg);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;padding:10px;font:12px/1.55 ui-monospace,Menlo,monospace}
  .log .error{color:var(--bad)} .log .warning{color:var(--warn)}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--card);border-left:1px solid var(--line);padding:22px;overflow:auto;z-index:20;box-shadow:-12px 0 40px rgba(0,0,0,.35)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;font-size:.8rem}
  a{color:var(--accent2);text-decoration:none} a:hover{text-decoration:underline} a.btn:hover,a.btn.primary:hover{text-decoration:none} .hidden{display:none !important}
  .reasons li{margin:3px 0} .reasons .reject{color:var(--bad)} .reasons .accept,.reasons .plus{color:var(--ok)} .reasons .minus{color:var(--warn)}
  .dd{position:relative;width:100%;min-width:0} select.cs-native{display:none !important}
  .dd-btn{width:100%;height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--fg);font:inherit;cursor:pointer;text-align:left;transition:.15s}
  .dd-btn:hover{border-color:var(--accent2)} .dd-btn:focus-visible,.dd.open .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);outline:none}
  .dd-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dd-btn svg{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s} .dd.open .dd-btn svg{transform:rotate(180deg)}
  .dd-menu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.2);overflow:auto;max-height:280px;animation:ddin .12s ease-out}
  @keyframes ddin{from{opacity:0;transform:translateY(-4px)}}
  .dd-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--fg);font-size:.92rem;white-space:nowrap}
  .dd-item.act{background:var(--chip)} .dd-item.sel{color:var(--accent2);font-weight:600} .dd-item svg{width:15px;height:15px;stroke:var(--accent2)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;max-width:90%;box-shadow:var(--shadow);background:var(--card2)}
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  @media (max-width:860px){
    .app{grid-template-columns:1fr} aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}
    .brand{padding:0 8px 0 0} .navlabel,.side-card,.themebtn .tl{display:none} nav{flex-direction:row;flex-wrap:wrap} nav button{padding:8px 10px} nav button span{display:none}
    .content{padding:18px 14px}
  }
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span class="logo" id="logo"></span>Job Search Agent</div>
  <div class="navlabel">Menu</div>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <div class="side-card"><div class="row"><span id="chip" class="pill">idle</span></div></div>
</aside>
<div class="content">
  <div class="pagehead"><div><h1 id="ptitle"></h1><div class="sub" id="psub"></div></div><span class="spacer"></span><button class="iconbtn" id="theme" aria-label="Toggle dark mode"></button><button class="avatar" id="avatar" title="Profile" aria-label="Profile"></button></div>
  <main id="main"></main>
</div>
</div>
<div id="drawer" class="drawer hidden"></div>

<script>
"use strict";
// ---------- tiny helpers (everything is built with textContent: job text can never inject HTML) ----------
// Element.replaceChildren would render null/false children as the text "null"/"false": skip them.
const _replaceChildren = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { return _replaceChildren.apply(this, kids.flat().filter((k) => k !== null && k !== undefined && k !== false)); };
const $ = (s, r = document) => r.querySelector(s);

const IST_PARTS = { date: new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric" }),
  time: new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) };
function ist(iso, what = "datetime") {
  const d = new Date(iso); if (!iso || isNaN(d)) return iso || "—";
  return what === "time" ? IST_PARTS.time.format(d) : `${IST_PARTS.date.format(d)}, ${IST_PARTS.time.format(d)} IST`;
}
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const safeUrl = (u) => { try { const p = new URL(u); return p.protocol === "http:" || p.protocol === "https:" ? p.href : null; } catch { return null; } };
function extLink(url, text, cls) { const u = safeUrl(url); return u ? h("a", { href: u, target: "_blank", rel: "noopener noreferrer", class: cls }, text) : h("span", { class: "muted" }, "no link"); }
async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.json !== undefined) { init.body = JSON.stringify(opts.json); init.headers["Content-Type"] = "application/json"; }
  if (opts.form) init.body = opts.form;
  const r = await fetch(path, init);
  let data = null; try { data = await r.json(); } catch { /* empty */ }
  if (!r.ok) { const e = new Error((data && (data.detail && (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)))) || `HTTP ${r.status}`); e.status = r.status; e.data = data; throw e; }
  return data;
}
const csv = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
const num = (s) => (s === "" || s === null ? null : Number(s));
function toast(msg, bad) { const t = h("div", { class: "banner toast", style: bad ? "border-color:var(--bad)" : "" }, msg); document.body.append(t); setTimeout(() => t.remove(), bad ? 6000 : 2500); }
function field(label, input, name) { return h("div", {}, h("label", {}, label), input, h("div", { class: "err", "data-err": name || "" })); }
function setErrors(root, errors) {
  root.querySelectorAll("[data-err]").forEach((e) => (e.textContent = ""));
  const friendly = (m) => (/valid number|should be a valid/i.test(m) ? "Enter a number" : /field required/i.test(m) ? "This field is required" : m);
  for (const err of errors || []) { const e = { ...err, message: friendly(err.message) }; const slot = root.querySelector(`[data-err="${e.field}"]`) || root.querySelector(`[data-err="${e.field.split(".")[0]}"]`); if (slot) slot.textContent = e.message; }
}
function bar(done, total) { const pct = total ? Math.min(100, Math.round((100 * done) / total)) : 0; return h("div", { class: "bar-outer" }, h("div", { class: "bar-inner", style: `width:${pct}%` })); }

// ---------- app shell ----------
const TABS = ["Dashboard", "Jobs", "Discover", "Runs", "Companies", "Profile"];
const ICONS = { Dashboard: "M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z", Jobs: "M3 7h18v13H3zM8 7V4h8v3", Discover: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5", Runs: "M13 3L4 14h7l-1 7 9-11h-7z", Companies: "M4 21V5l8-2v18M12 9h8v12M7 9h2M7 13h2M7 17h2M15 13h2M15 17h2", Profile: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",
  check: "M5 13l4 4L19 7", clock: "M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z", cross: "M6 6l12 12M18 6L6 18", all: "M4 6h16M4 12h16M4 18h16" };
const HEAD = { Dashboard: ["Dashboard", "The big picture: where your matched jobs come from"], Jobs: ["Jobs", "Every job the AI has judged against your profile, line by line"], Discover: ["Discover", "Search company pages and LinkedIn for new roles"], Runs: ["Runs", "Live progress and history of discovery runs"], Companies: ["Companies", "Choose which career pages to monitor"], Profile: ["Profile", "What you want: pay, titles, skills and resumes"] };
function icon(d) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.9"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !ddOpen) closeDrawer(); });

// ---------- styled dropdowns: every <select> keeps working (value, change event) but is drawn as a themed menu ----------
let ddOpen = null;
function ddClose() { if (ddOpen) { ddOpen.menu.remove(); ddOpen.wrap.classList.remove("open"); ddOpen = null; } }

new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.tagName === "SELECT") enhanceSelect(n); else enhanceAll(n); } }).observe(document.body, { childList: true, subtree: true });
